# Rx interpretation map (guidelines §RX). Rx reports show drug/strength/qty/days/prescriber, never diagnosis.
# entry: drug: [brand, [strengths], impact, [indications -> impairments.yaml keys or nonmedical tags]]
#   impact: high (likely ratable; undisclosed -> APS, RX-3) | ambiguous (RX-2.3; list all plausible) | low (ignore)
#   first indication listed = most common; for ambiguous drugs RX-2.4 says rate the least severe plausible
#   (least-severe ordering in `least_severe_order` below).
# prescriber specialties used by the Rx renderer to hint indication: see `specialty_hints`.
