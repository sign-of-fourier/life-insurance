  M03: {desc: "Improper lane change", class: minor}
  M04: {desc: "Following too closely", class: minor}
  M05: {desc: "Improper turn", class: minor}
  M06: {desc: "Failure to signal", class: minor}
  M07: {desc: "Use of handheld device while driving", class: minor}
  M08: {desc: "Seat belt violation", class: nonmoving}
  M09: {desc: "Careless driving", class: minor}
  M10: {desc: "Passing school bus", class: major}
  R01: {desc: "Reckless driving", class: major}
