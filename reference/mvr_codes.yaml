# MVR violation codes (synthetic, ACD-flavored). class: minor | major | dui | nonmoving | accident | admin
# Vendors print code + description differently (see vendors.yaml); some print state statute numbers instead.
codes:
  S05: {desc: "Speeding 1-5 over limit", class: minor}
  S10: {desc: "Speeding 6-10 over limit", class: minor}
  S15: {desc: "Speeding 11-15 over limit", class: minor}
  S20: {desc: "Speeding 16-20 over limit", class: minor}
  S25: {desc: "Speeding 21-25 over limit", class: minor}
