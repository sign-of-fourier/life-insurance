# Underwriter personas for Phase 6 noisy-note rendering. All invented.
# Rates are per-opportunity probabilities.
#   sentences: 0 = pure fragments, 1 = full sentences
#   abbrev: {t1, t2, t3} probability of abbreviating when an abbreviation exists in that tier
#   typo: per-word typo rate | arith_err: per-worksheet chance of a wrong sum (golden is right)
#   omit: per-trace-step chance the step is not written | wrong_final: chance stated decision differs w/o grey basis
#   leniency: -1 (always strictest option in GRY range) .. +1 (always most lenient)
#   cite_rules: chance a worksheet line cites a rule id | case: lower | upper | mixed | normal
#   entries: how observations are timestamped: per_doc (one entry per evidence arrival) | batch (few big entries) | final_only
#   worksheet: A debit_grid | B shorthand_list | C freeform_math | D checklist_partial
formats:
  A: {name: debit_grid, desc: "table-like lines: item | rule | debits, total, class"}
  B: {name: shorthand_list, desc: "one-line items with arrows, minimal structure"}
  C: {name: freeform_math, desc: "running arithmetic in prose: 'htn +25, bld +50 = 75 -> C'"}
  D: {name: checklist_partial, desc: "CLS-4 steps as a checklist, some left blank"}

