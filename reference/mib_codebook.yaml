# Synthetic MIB-style codebook (invented; resembles the idea, not the real MIB code set).
# Code = 6 digits: S C C D R Q
#   SCC (3) condition; first digit S = body system
#   D   degree / severity / test status
#   R   source of the information reported to the bureau
#   Q   qualifier (treatment / timing / prior-insurer action)
# Generated docs: reference/mib_codebook.md (src/gen_mib.py). Rule refs: guidelines §MIB.

systems:
  0: General & administrative (build, insurance activity, hazardous activity, driving)
  1: Cardiovascular
  2: Digestive & liver
  3: Nervous system
  4: Psychiatric & substance use
  5: Respiratory
  6: Endocrine & metabolic
  7: Genitourinary, renal & reproductive
  8: Neoplasm & blood
  9: Musculoskeletal, immune, skin & other

degree:   # 4th digit
  0: unspecified
  1: history of / resolved
  2: mild / slight
  3: moderate
  4: severe / marked
  5: abnormal test value, borderline
  6: abnormal test value, significant
  7: under investigation / unconfirmed
  8: treated, reported controlled
  9: degree not reported

source:   # 5th digit
  0: applicant admission (prior application)
  1: attending physician statement / medical records
  2: lab or paramedical exam
  3: prescription database
  4: motor vehicle / public record
  5: electronic health record (eMed) feed
  6: claim (health/disability/life)
  7: other insurer, source not stated
  8: interview / inspection report
  9: foreign source

qualifier:  # 6th digit
  0: none
  1: surgical treatment
  2: medication
  3: hospitalized
  4: emergency visit
  5: within past 12 months
  6: 1–5 years ago
  7: more than 5 years ago
  8: recurrence / relapse
  9: prior insurer rated, postponed or declined

