# Abbreviation dictionary for UW notes.
# tier1: common medical (a foundation model probably decodes)
# tier2: life-UW industry jargon (partly decodable)
# tier3: house / personal shorthand INVENTED for this dataset - only decodable with this file.
# Each entry: abbrev: meaning | {m: meaning, v: [variants personas may use]}

tier1:
  HTN: hypertension
  DM: diabetes mellitus
  DM2: {m: type 2 diabetes, v: [T2DM, NIDDM, DMII]}
  DM1: {m: type 1 diabetes, v: [T1DM, IDDM]}
  CAD: coronary artery disease
  MI: myocardial infarction
  CABG: {m: coronary artery bypass graft, v: [cabbage]}
  PCI: {m: percutaneous coronary intervention (stent), v: [s/p stent]}
  AF: {m: atrial fibrillation, v: [afib, a-fib, AFL]}
  CHF: congestive heart failure
  EF: ejection fraction
  LVH: left ventricular hypertrophy
  COPD: chronic obstructive pulmonary disease
  OSA: obstructive sleep apnea
  CPAP: continuous positive airway pressure
  GERD: gastroesophageal reflux
  IBD: inflammatory bowel disease
  UC: ulcerative colitis
  CKD: chronic kidney disease
  TIA: transient ischemic attack
  CVA: stroke
  MS: multiple sclerosis
  PE: pulmonary embolism
  DVT: deep vein thrombosis
  MDD: major depressive disorder
  GAD: generalized anxiety disorder
  BPAD: {m: bipolar affective disorder, v: [BPD, bipolar]}
  ADHD: {m: attention deficit hyperactivity disorder, v: [ADD]}
  PTSD: post-traumatic stress disorder
  AUD: alcohol use disorder
  SUD: substance use disorder
  BCC: basal cell carcinoma
  SCC: squamous cell carcinoma
  DCIS: ductal carcinoma in situ
  NHL: non-Hodgkin lymphoma
  CLL: chronic lymphocytic leukemia
  RA: rheumatoid arthritis
  SLE: lupus
  OA: osteoarthritis
  BPH: benign prostatic hyperplasia
  PSA: prostate specific antigen
  A1c: {m: hemoglobin A1c, v: [HbA1c, h1a1c, hba1c, A1C, a1c]}
  FBS: fasting blood sugar
  LFTs: liver function tests
  eGFR: estimated glomerular filtration rate
  Cr: creatinine
  TC: total cholesterol
  HDL: HDL cholesterol
  LDL: LDL cholesterol
  TG: {m: triglycerides, v: [trigs, trig]}
  BP: blood pressure
  HR: heart rate
  BMI: body mass index
  Hx: history
  FHx: {m: family history, v: [FH, fam hx]}
  Dx: diagnosis
  Tx: treatment
  Rx: prescription
  s/p: status post
  r/o: rule out
  w/: with
  w/o: without
  d/t: due to
  c/o: complains of
  f/u: follow-up
  prn: as needed
  bid: twice daily
  qd: daily
  yo: years old
  yrs: years
  mos: months
  neg: negative
  pos: positive
  WNL: within normal limits
  NAD: no acute distress
  SOB: shortness of breath
  ER: emergency room
  PCP: primary care physician
  ECHO: echocardiogram
  EKG: {m: electrocardiogram, v: [ECG]}
  ETT: exercise treadmill (stress) test
  ICS: inhaled corticosteroid
  GLP1: {m: GLP-1 agonist, v: [glp-1, GLP]}
  SSRI: selective serotonin reuptake inhibitor
  ART: antiretroviral therapy
  SVR: sustained virologic response (hep C cure)
  EDSS: MS disability scale
  AHI: apnea-hypopnea index
  FEV1: forced expiratory volume 1 sec

tier2:
  UW: underwriter / underwriting
  APS: attending physician statement
  PM: {m: paramedical exam, v: [para, paramed, PMX]}
  B&U: {m: blood and urine, v: [BU, b/u, fluids]}
  OF: {m: oral fluid (saliva) test, v: [saliva, OFT]}
  MIB: Medical Information Bureau check
  MVR: motor vehicle report
  Rx hx: {m: prescription history report, v: [scripts, Rx chk, RxH]}
  build: height and weight
  "5.10.130": "build notation: 5 ft 10 in, 130 lb (also 5'10/130, 510/130, 70/130)"
  NT: {m: non-tobacco, v: [NS, nonsmoker, N/T]}
  T: {m: tobacco, v: [SM, smoker, tob]}
  PP: Preferred Plus
  P: Preferred
  SP: {m: Standard Plus, v: [S+, std+]}
  S: {m: Standard, v: [std, STD, 100]}
  ST: {m: Standard Tobacco, v: [std tob, ST/T, STS]}
  PT: {m: Preferred Tobacco, v: [pref tob]}
  E: {m: Elite, v: [SPNT, super pref, E-class]}
  "T1..T16": {m: table rating 1-16, v: ["tbl 2", "tbl B", "Tab 4", "T-4"]}
  "A..P": table letters (A=1 ... P=16)
  "+125": "table 1 = 125% mortality (each +25 = one table)"
  "+150": table 2
  "+200": table 4
  FE: {m: flat extra, v: [flat, f/x]}
  "FE 5/3": "flat extra $5 per $1000 for 3 years"
  "FE 2.5 perm": permanent flat extra $2.50 per $1000
  PPN: {m: postpone, v: [PP'd, postponed, PPD-ed]}
  DEC: {m: decline, v: [DCL, decl, DNI]}
  NTO: {m: not taken offer, note: "status, not a decision"}
  IC: {m: individual consideration, v: [ICB]}
  MD: medical director
  CUO: chief underwriting officer
  ACCEL: {m: accelerated (no-fluid) path, v: [accel, AUW, fluidless]}
  "+25 debits": debits (each 25 = one table)
  "-15 cr": credit
  RTW: return to work
  NOT: notice of tentative offer / counter-offer
  CO: {m: counter-offer, v: [c/o offer, cntr]}
  "u/a": urinalysis
  cot: {m: cotinine, v: [cotin, nic, nic+]}
  HIV-: HIV negative on screen
  "1035": 1035 exchange (replacement) - financial note
  FINQ: {m: financial questionnaire, v: [fin q, FQ]}
  AVQ: {m: aviation questionnaire, v: [av q]}
  AVOQ: {m: avocation questionnaire, v: [avo q, hazard q]}
  misrep: material misrepresentation
  "no hit": MIB returned no codes
  "hit": MIB returned code(s)
  "SOE": statement of evidence / evidence summary
  "pk-yrs": pack-years
  "ppd": packs per day
  "dpw": drinks per week
  "pos cot": positive cotinine
  WP: waiver of premium
  ADB: accidental death benefit
  CTR: children's term rider
  GIO: guaranteed insurability option
  ABR: accelerated benefit rider
  "TWD": "temporary while disabled - informal WP status note"

tier3:   # INVENTED house shorthand. No public meaning.
  "OKAP": issue as applied for (class and amount as requested)
  "KTA": "kicked to APS - ordered APS and holding"
  "PEND-R": pending requirements outstanding
  "DD": "double-dipped - evidence counted under two rules, fixed"
  "CL5": "checked the class matrix (CLS-5) row by row"
  "M5": "matrix fail count (e.g. 'M5x2' = failed 2 preferred rows)"
  "GRYd": "used grey-area discretion (GRY rule)"
  "nfz": "no further action - finding dismissed as irrelevant"
  "zz": "not ratable / ignore"
  "dbl-ck": "verified against a second source"
  "ghost": "MIB code with no corroboration (MIB-4 not corroborated)"
  "rrx": "rated on Rx evidence pending APS"
  "lsp": "least-severe-plausible indication applied (RX-2.4)"
  "stale": "APS > 24 mo for active condition (APS-3)"
  "worst-doc": "rated as worst documented value"
  "cpfwd": "copy-forward text in APS, ignored"
  "BL": borderline value at a threshold
  "BLu": borderline, rounded up (adverse)
  "BLd": borderline, rounded down (favorable)
  "TC#": "tobacco class check done (CLS-2)"
  "Tlad": moved to tobacco ladder
  "NTlad": stays non-tobacco ladder
  "ldr": ladder
  "cap@": "class capped at (e.g. cap@SP)"
  "ko": "knockout (postpone/decline trigger hit)"
  "k/o-pp": knockout - postpone
  "k/o-d": knockout - decline
  "FTJ": "fails financial justification (FIN-1)"
  "CTO": "counter-offer amount (FIN-2.2)"
  "x-over": "over-insured percentage"
  "Q-flip": "app answer contradicted by 3rd party evidence"
  "fluid-up": "converted accel case to fluids"
  "3P": third-party data (Rx/MIB/MVR) as a group
  "3P-clr": third-party data all clear
  "lab-clr": labs all within UW limits
  "PMclr": paramed unremarkable
  "∆": change from preliminary class
  "→": "results in"
  "//": "per / according to"
  "^": elevated
  "vv": low
  "~": approximately
  "√": confirmed / checked
  "?": unclear / to verify
  "#s": lab numbers / values
  # rider codes in house variants (map to official RID codes)
  "W": "WP (waiver of premium)"
  "WV": "WP"
  "W/D": "WMD (waiver of monthly deduction)"
  "AD": "ADB"
  "DBA": "ADB (double benefit accident, legacy name)"
  "KR": "CTR (kids rider)"
  "G-opt": "GIO"
  "GO": "GIO"
  "ABR-T": "ABR"
  "CHR": "CIA (chronic illness)"
  "XC": "XCR (extended conversion)"
  "XCV": "XCR"
  "SPR": "OIR (spouse rider)"
  "2nd-ins": "OIR"
  "RP": "ROP-T"
  "ROP": "ROP-T"
  "KP": "KPE"
  "LT+": "LTA (level term addition)"
  "LTX": "LTA"
  "rdr dcl": rider declined
  "rdr ok": rider approved
  "rdr mod": rider modified
  # personal quirks (attached to specific personas in uw_personas.yaml)
  "B-": "persona habit: 'borderline but let it go'"
  "rs": "persona habit: 'reasonable' / acceptable"
  "nbd": "persona habit: no big deal (= no impact)"
  "pnr": "persona habit: 'per new rules' = cites current guideline version"
  "chk w/MD": "consulted medical director informally"
  "DNR-UW": "persona habit: 'do not re-underwrite' - accept prior decision on same file"
