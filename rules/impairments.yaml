# Medical impairment catalog. Mirrors guidelines.md medical chapters.
#
# Used by: Phase 3/4 generators (sample a profile -> build truth + evidence that implies it)
#          Phase 5 engine (evaluate `match` predicates against attributes established from evidence)
#
# Profile fields:
#   match:   attribute predicates (all must hold). Ops: value | [lo, hi] inclusive | {lt|le|gt|ge: x} | {in: [...]}
#   debits:  int, or "grid" (look up in `grid`), or omitted (0)
#   best:    class cap (non-tobacco name; map to tobacco ladder via classes.yaml tobacco_equivalent)
#   outcome: rate (default) | postpone | decline | md
#   fe:      {per_k, years}  (years null = permanent)
#   postpone_months: int
# Attributes common to all: years_since (dx or event or last tx, per chapter), age (insurance age).
# Profiles are evaluated top-down; first match wins. `add` blocks are modifiers that stack.

hypertension:
  chapter: HTN
  label: Hypertension
  rule_ids: [HTN-1, HTN-2, HTN-3, HTN-4, HTN-5]
  attributes: [bp_avg_sys, bp_avg_dia, agents, lvh, retinopathy]
  engine: htn_table             # BP debit rows in nonmedical.yaml htn
  rx: [lisinopril, losartan, amlodipine, hydrochlorothiazide, metoprolol, chlorthalidone, olmesartan, valsartan, carvedilol, spironolactone]
  order: {aps_if: "agents>=2 or avg>150/95"}
  severity_hint: {mild: "1 agent, controlled", moderate: "2 agents or 141-160", severe: ">=3 agents or >160 or LVH"}

cad:
  chapter: CV
  label: Coronary artery disease / MI / stent / CABG
  rule_ids: [CV-1, CV-1.1, CV-1.2, CV-1.3]
  attributes: [age_at_event, years_since, ef, angina, smoker, abnormal_stress, vessels, ldl, normal_stress_12mo]
  order: [APS_cardiology, EKG, NTPROBNP]
  rx: [atorvastatin, rosuvastatin, clopidogrel, aspirin, metoprolol, nitroglycerin, ticagrelor, ezetimibe]
  best: Standard
  postpone_if: {years_since: {lt: 0.5}, months: 6}
  grid:   # rows = age_at_event band, cols = years since: [0.5-1, 1-2, 2-5, >5]
    bands_age: [[0, 39], [40, 49], [50, 59], [60, 69], [70, 120]]
    bands_years: [[0.5, 1], [1, 2], [2, 5], [5, 100]]
    values:
      - [decline, 200, 150, 125]
      - [200, 150, 100, 75]
      - [150, 100, 75, 50]
      - [100, 75, 50, 25]
      - [75, 50, 25, 25]
  add:
    - {match: {ef: [40, 49]}, debits: 50}
    - {match: {ef: [30, 39]}, debits: 100}
    - {match: {ef: {lt: 30}}, outcome: decline}
    - {match: {angina: true}, debits: 50}
    - {match: {smoker: true}, debits: 50}
    - {match: {abnormal_stress: true}, debits: 75, md: true}
    - {match: {vessels: {ge: 3}}, debits: 25}
    - {match: {ldl: {lt: 70}, normal_stress_12mo: true}, debits: -25}

cad_nonobstructive:
  chapter: CV
  label: Non-obstructive CAD (<50%) / coronary calcium
  rule_ids: [CV-1.4, CV-1.5]
  attributes: [stenosis_pct, cac_score]
  profiles:
    - {id: nonobstructive, match: {stenosis_pct: [1, 49]}, debits: 25, best: Standard}
    - {id: cac_0_99, match: {cac_score: [0, 99]}, debits: 0}
    - {id: cac_100_399, match: {cac_score: [100, 399]}, debits: 25}
    - {id: cac_400, match: {cac_score: {ge: 400}}, debits: 50}

afib:
  chapter: CV
  label: Atrial fibrillation / flutter
  rule_ids: [CV-2]
  attributes: [type, echo_normal, chads_vasc, structural, ablation_years, years_since]
  rx: [apixaban, rivaroxaban, warfarin, diltiazem, metoprolol, flecainide, amiodarone]
  order: [APS_cardiology]
  profiles:
    - {id: ablated, match: {ablation_years: {ge: 1}}, debits: 0, best: Standard Plus}
    - {id: single_episode, match: {type: single, years_since: {ge: 1}, echo_normal: true}, debits: 0, best: Preferred}
    - {id: structural, match: {structural: true}, debits: 100, outcome: md}
    - {id: paroxysmal, match: {type: paroxysmal, echo_normal: true, chads_vasc: {le: 1}}, debits: 25}
    - {id: persistent, match: {type: {in: [persistent, permanent]}, echo_normal: true}, debits: 50}

valve:
  chapter: CV
  label: Valvular disease / murmur
  rule_ids: [CV-3]
  attributes: [kind, severity_grade, repaired_years]
  profiles:
    - {id: innocent, match: {kind: innocent_murmur}, debits: 0}
    - {id: mvp_mild, match: {kind: mvp, severity_grade: {in: [trace, mild]}}, debits: 0, best: Preferred Plus}
    - {id: replaced_recent, match: {repaired_years: {lt: 1}}, outcome: postpone, postpone_months: 12}
    - {id: replaced, match: {repaired_years: {ge: 1}}, debits: 75}
    - {id: moderate, match: {severity_grade: moderate}, debits: 50}
    - {id: severe, match: {severity_grade: severe}, outcome: decline}

cardiomyopathy:
  chapter: CV
  label: Heart failure / cardiomyopathy
  rule_ids: [CV-4]
  attributes: [ef, recovered_years, hcm]
  rx: [sacubitril-valsartan, carvedilol, furosemide, spironolactone, empagliflozin]
  profiles:
    - {id: hcm, match: {hcm: true}, debits: 75, outcome: md}
    - {id: low_ef, match: {ef: {lt: 40}}, outcome: decline}
    - {id: recovered, match: {ef: {ge: 50}, recovered_years: {gt: 2}}, debits: 50}
    - {id: mid_ef, match: {ef: [40, 49]}, debits: 100}

arrhythmia_other:
  chapter: CV
  label: PVCs / SVT / WPW / BBB / pacemaker / syncope
  rule_ids: [CV-5]
  attributes: [kind, ablated, echo_normal]
  profiles:
    - {id: pvc, match: {kind: pvc, echo_normal: true}, debits: 0}
    - {id: svt_ablated, match: {kind: svt, ablated: true}, debits: 0}
    - {id: svt, match: {kind: svt}, debits: 25}
    - {id: wpw_ablated, match: {kind: wpw, ablated: true}, debits: 0}
    - {id: wpw, match: {kind: wpw}, debits: 25}
    - {id: rbbb, match: {kind: rbbb}, debits: 0}
    - {id: lbbb, match: {kind: lbbb}, debits: 25}
    - {id: pacemaker, match: {kind: pacemaker}, debits: 25}
    - {id: vasovagal, match: {kind: vasovagal}, debits: 0}

pad_aaa:
  chapter: CV
  label: Peripheral arterial disease / aortic aneurysm
  rule_ids: [CV-6]
  attributes: [kind, smoker, size_cm, repaired_months]
  profiles:
    - {id: pad_smoker, match: {kind: pad, smoker: true}, debits: 125, best: Standard}
    - {id: pad, match: {kind: pad}, debits: 75, best: Standard}
    - {id: aaa_repaired, match: {kind: aaa, repaired_months: {ge: 6}}, debits: 50}
    - {id: aaa_small, match: {kind: aaa, size_cm: {lt: 4.0}}, debits: 50}
    - {id: aaa_mid, match: {kind: aaa, size_cm: [4.0, 5.0]}, debits: 100}
    - {id: aaa_large, match: {kind: aaa, size_cm: {gt: 5.0}}, outcome: decline}

prediabetes:
  chapter: DM
  label: Prediabetes / impaired fasting glucose
  rule_ids: [DM-1]
  attributes: [a1c_avg]
  rx: [metformin]
  profiles:
    - {id: low, match: {a1c_avg: {le: 6.0}}, debits: 0, best: Preferred}
    - {id: high, match: {a1c_avg: [6.1, 6.4]}, debits: 0, best: Standard Plus}

diabetes_t2:
  chapter: DM
  label: Type 2 diabetes
  rule_ids: [DM-2, DM-2.1, DM-2.2, DM-2.3, DM-2.4, DM-2.5]
  attributes: [a1c_avg, a1c_available, insulin, duration_years, age_at_dx, microalbuminuria, neuropathy, retinopathy, cad]
  rx: [metformin, glipizide, glimepiride, sitagliptin, empagliflozin, dapagliflozin, semaglutide, tirzepatide, dulaglutide, insulin glargine, insulin lispro, pioglitazone]
  order: [APS, B, U]
  best: Standard
  missing_a1c_assume: 8.5     # DM-2.4 (8.0-8.9 column)
  grid:
    bands_age: [[18, 39], [40, 49], [50, 59], [60, 69], [70, 120]]
    bands_a1c: [[0, 6.99], [7.0, 7.99], [8.0, 8.99], [9.0, 9.99], [10.0, 99]]
    values:
      - [75, 100, 150, 200, decline]
      - [50, 75, 125, 175, decline]
      - [25, 50, 100, 150, 200]
      - [0, 25, 75, 125, 175]
      - [0, 0, 50, 100, 150]
  add:
    - {match: {insulin: true}, debits: 25}
    - {match: {duration_years: {gt: 15}}, debits: 25}
    - {match: {age_at_dx: {lt: 30}}, debits: 25}
    - {match: {microalbuminuria: true}, debits: 50, cmb3_group: renal_protein}
    - {match: {neuropathy: true}, debits: 25}
    - {match: {retinopathy: nonproliferative}, debits: 25}
    - {match: {retinopathy: proliferative}, debits: 75}
    - {match: {cad: true}, debits: 50, rule: CMB-2}
  best_override: {match: {insulin: false, a1c_avg: {lt: 7.0}, age: {ge: 60}, complications: false}, best: Standard Plus}

diabetes_t1:
  chapter: DM
  label: Type 1 diabetes
  rule_ids: [DM-3]
  attributes: [a1c_avg, age, pump_cgm]
  rx: [insulin glargine, insulin lispro, insulin aspart, insulin degludec]
  uses_grid_of: diabetes_t2
  add_flat: 50
  decline_if: {age: {lt: 30}, a1c_avg: {ge: 8.5}}
  pump_credit: {match: {pump_cgm: true, a1c_avg: {lt: 7.0}, age: {ge: 40}}, debits: -25, md: true}
  best: Standard

gestational_dm:
  chapter: DM
  label: Gestational diabetes (resolved)
  rule_ids: [DM-4]
  profiles:
    - {id: resolved, match: {resolved: true}, debits: 0, best: Preferred}

cancer:
  chapter: CA
  label: Cancer (see type table)
  rule_ids: [CA, CA-1, CA-2, CA-3]
  attributes: [type, stage, years_since_tx, gleason, psa_undetectable, surveillance, recurrence]
  order: [APS_oncology]
  best: Standard
  unknown_stage: next_worse    # CA-1 / GRY-6
  recurrence: decline
  # rows: years_since_tx windows [lo, hi) -> outcome; fe = {per_k, years}
  types:
    bcc_scc: [{years: [0, 100], debits: 0, best: null}]
    melanoma_in_situ: [{years: [0, 2], debits: 0, best: Standard}, {years: [2, 100], debits: 0, best: Preferred}]
    melanoma_1:
      - {years: [0, 2], fe: {per_k: 10, years: 3}}
      - {years: [2, 5], fe: {per_k: 5, years: 2}}
      - {years: [5, 100], debits: 0, best: Standard Plus}
    melanoma_2:
      - {years: [0, 2], outcome: postpone}
      - {years: [2, 5], fe: {per_k: 10, years: 4}}
      - {years: [5, 10], fe: {per_k: 5, years: 3}}
      - {years: [10, 100], debits: 0}
    melanoma_3_4: [{years: [0, 10], outcome: decline}, {years: [10, 100], outcome: md}]
    breast_dcis:
      - {years: [0, 1], outcome: postpone}
      - {years: [1, 3], fe: {per_k: 5, years: 2}}
      - {years: [3, 100], debits: 0, best: Standard Plus}
    breast_1:
      - {years: [0, 1], outcome: postpone}
      - {years: [1, 3], fe: {per_k: 10, years: 4}}
      - {years: [3, 5], fe: {per_k: 7.5, years: 3}}
      - {years: [5, 10], fe: {per_k: 5, years: 2}}
      - {years: [10, 100], debits: 0}
    breast_2:
      - {years: [0, 2], outcome: postpone}
      - {years: [2, 5], fe: {per_k: 15, years: 5}}
      - {years: [5, 10], fe: {per_k: 7.5, years: 3}}
      - {years: [10, 100], debits: 25}
    breast_3:
      - {years: [0, 5], outcome: decline}
      - {years: [5, 10], fe: {per_k: 15, years: 5}, debits: 25}
      - {years: [10, 100], debits: 50}
    prostate_surveillance: [{years: [0, 100], debits: 25, best: Standard}]
    prostate_le7_surgery:
      - {years: [0, 1], outcome: postpone}
      - {years: [1, 3], fe: {per_k: 5, years: 3}}
      - {years: [3, 100], debits: 0, best: Standard Plus}
    prostate_ge8:
      - {years: [0, 3], outcome: decline}
      - {years: [3, 5], fe: {per_k: 15, years: 5}}
      - {years: [5, 100], fe: {per_k: 7.5, years: 3}}
    colon_1:
      - {years: [0, 1], outcome: postpone}
      - {years: [1, 5], fe: {per_k: 10, years: 3}}
      - {years: [5, 100], debits: 0}
    colon_2:
      - {years: [0, 2], outcome: postpone}
      - {years: [2, 5], fe: {per_k: 15, years: 4}}
      - {years: [5, 100], fe: {per_k: 5, years: 2}}
    colon_3:
      - {years: [0, 5], outcome: decline}
      - {years: [5, 10], fe: {per_k: 10, years: 3}}
      - {years: [10, 100], debits: 0}
    thyroid:
      - {years: [0, 1], fe: {per_k: 5, years: 2}}
      - {years: [1, 5], debits: 0, best: Standard}
      - {years: [5, 100], debits: 0, best: Preferred}
    hodgkin_1_2:
      - {years: [0, 2], outcome: postpone}
      - {years: [2, 5], fe: {per_k: 10, years: 5}}
      - {years: [5, 10], debits: 50}
      - {years: [10, 100], debits: 25}
    nhl_indolent: [{years: [0, 100], debits: 75, best: Standard}]
    nhl_aggressive:
      - {years: [0, 3], outcome: decline}
      - {years: [3, 5], fe: {per_k: 15, years: 5}}
      - {years: [5, 100], debits: 50}
    cll_rai0: [{years: [0, 100], debits_by_age: {under60: 75, "60plus": 25}}]
    acute_leukemia: [{years: [0, 5], outcome: decline}, {years: [5, 100], outcome: md}]
    testicular_seminoma_1:
      - {years: [0, 1], outcome: postpone}
      - {years: [1, 3], fe: {per_k: 5, years: 2}}
      - {years: [3, 100], debits: 0}
    lung_pancreas_esophagus_brain: [{years: [0, 100], outcome: decline}]
    other_unlisted: [{years: [0, 5], outcome: decline}, {years: [5, 100], outcome: md}]   # MISC-3
  stage_order:   # for CA-1 "next worse stage"
    melanoma: [melanoma_in_situ, melanoma_1, melanoma_2, melanoma_3_4]
    breast: [breast_dcis, breast_1, breast_2, breast_3]
    prostate: [prostate_surveillance, prostate_le7_surgery, prostate_ge8]
    colon: [colon_1, colon_2, colon_3]
  rx: [tamoxifen, anastrozole, letrozole, exemestane, leuprolide, bicalutamide, capecitabine, ondansetron, levothyroxine]

